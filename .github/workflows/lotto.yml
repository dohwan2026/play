name: 로또 당첨번호 받기

on:
  schedule:
    - cron: '0 0 * * 0'   # 매주 일요일 09:00 (한국 시각), 토요일 추첨 다음 날
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotto
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 당첨번호 받기
        run: python fetch_lotto.py lotto645_all.csv
      - name: 바뀐 데이터 저장
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lotto645_all.csv lotto_data.js
          git diff --cached --quiet || (git commit -m '당첨번호 갱신' && git push)
